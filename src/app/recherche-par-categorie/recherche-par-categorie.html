<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      
      <h2>Recherche par Catégorie</h2>
      <div class="col-sm-6 col-md-6 col-lg-6 mb-3">
        <label class="form-label">Catégorie</label>
        <select class="form-control form-control-lg" id="idCategorie" name="idCategorie" [(ngModel)]="idCategorie" (change)="onChange()">
          <option *ngFor="let cat of categories" [value]="cat.idCat">
            {{ cat.nomCat }}
          </option>
        </select>
      </div>
      <table class="table table-striped" *ngIf="voitures && voitures.length > 0">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom</th>
            <th>Prix</th>
            <th>Date Création</th>
            <th>Catégorie</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let voiture of voitures">
            <td>{{ voiture.idVoiture }}</td>
            <td>{{ voiture.nomVoiture }}</td>
            <td>{{ voiture.prixVoiture }}</td>
            <td>{{ voiture.dateCreation | date:'dd/MM/yyyy' }}</td>
            <td>{{ voiture.categorie?.nomCat }}</td>
            <td>
                <button (click)="supprimerVoiture(voiture)" type="button" class="btn btn-danger btn-sm">Supprimer</button>
                <button class="btn btn-primary btn-sm me-2" [routerLink]="['/updatevoiture', voiture.idVoiture]">Modifier</button>
                
            </td>
          </tr>
        </tbody>
      </table>
      <div *ngIf="voitures && voitures.length === 0" class="alert alert-warning mt-3">
        Aucune voiture trouvée pour cette catégorie !
      </div>

    </div>
  </div>
</div>

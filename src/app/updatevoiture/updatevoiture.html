<div class="container">
  <h2>Modifier un Voiture :</h2>              
  <form (ngSubmit)="onUpdateVoiture()">  
     
      <div class="col-sm-2 col-md-2 col-lg-2"> 
        <label>ID Voiture</label> 
        <input type="text" [(ngModel)]="currentVoiture.idVoiture" name="idVoiture" class="form-control" readonly> 
      </div> 
   
      <div class="col-sm-4 col-md-4 col-lg-4"> 
        <label>Nom Voiture</label> 
        <input type="text" [(ngModel)]="currentVoiture.nomVoiture" name="nomVoiture" class="form-control">
      </div> 

      <div class="col-sm-2 col-md-2 col-lg-2"> 
        <label>Prix Voiture</label> 
        <input type="number" [(ngModel)]="currentVoiture.prixVoiture" name="prixVoiture" class="form-control"> 
      </div> 

      <div class="col-sm-4 col-md-4 col-lg-4"> 
        <label>Date création</label> 
        <input type="date" [(ngModel)]="currentVoiture.dateCreation" name="dateCreation" class="form-control"> 
      </div>  
<div class="col-sm-4 col-md-4 col-lg-4"> 
      <label>Categorie</label> 
      <select class="form-control form-control-lg" id="updatedCatId" name="updatedCatId" [(ngModel)]="updatedCatId"> 
        @for(cat of categories; track cat.idCat){ 
          <option [value]="cat.idCat"> {{cat.nomCat}} </option> 
        } 
      </select> 
    </div>
      <div class="mt-2"> 
        <button type="submit" class="btn btn-success" >Modifier</button> 
      </div>    
  </form> 
</div>
